<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>はじめてのじゃんけんゲーム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff7ed, #eff6ff);
      color: #1f2937;
    }
    .game {
      width: min(92vw, 560px);
      background: rgba(255,255,255,.92);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }
    h1 { margin-top: 0; font-size: 2rem; }
    .subtitle { color: #6b7280; margin-bottom: 26px; }
    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    button {
      border: 0;
      border-radius: 18px;
      padding: 18px 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      background: #f3f4f6;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
    }
    .emoji { display: block; font-size: 2.5rem; margin-bottom: 8px; }
    .result {
      min-height: 150px;
      margin-top: 26px;
      padding: 20px;
      border-radius: 18px;
      background: #f9fafb;
    }
    #message { font-size: 1.4rem; font-weight: 800; margin: 12px 0; }
    .score {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 18px;
      font-weight: 700;
    }
    .reset {
      margin-top: 20px;
      padding: 10px 18px;
      font-size: .95rem;
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>✊✌️🖐️ じゃんけんゲーム</h1>
    <p class="subtitle">出す手を選んでください！</p>

    <div class="buttons">
      <button onclick="play('グー')"><span class="emoji">✊</span>グー</button>
      <button onclick="play('チョキ')"><span class="emoji">✌️</span>チョキ</button>
      <button onclick="play('パー')"><span class="emoji">🖐️</span>パー</button>
    </div>

    <section class="result">
      <div id="choices">あなた：？　｜　コンピューター：？</div>
      <div id="message">勝負しましょう！</div>
      <div class="score">
        <span>あなた <strong id="playerScore">0</strong>勝</span>
        <span>CPU <strong id="cpuScore">0</strong>勝</span>
      </div>
    </section>

    <button class="reset" onclick="resetGame()">スコアをリセット</button>
  </main>

  <script>
    const hands = ['グー', 'チョキ', 'パー'];
    const emoji = { 'グー': '✊', 'チョキ': '✌️', 'パー': '🖐️' };
    let playerScore = 0;
    let cpuScore = 0;

    function play(player) {
      const cpu = hands[Math.floor(Math.random() * hands.length)];
      let message;

      if (player === cpu) {
        message = 'あいこ！ 😄';
      } else if (
        (player === 'グー' && cpu === 'チョキ') ||
        (player === 'チョキ' && cpu === 'パー') ||
        (player === 'パー' && cpu === 'グー')
      ) {
        playerScore++;
        message = 'あなたの勝ち！ 🎉';
      } else {
        cpuScore++;
        message = 'コンピューターの勝ち！ 🤖';
      }

      document.getElementById('choices').textContent =
        `あなた：${emoji[player]} ${player}　｜　コンピューター：${emoji[cpu]} ${cpu}`;
      document.getElementById('message').textContent = message;
      document.getElementById('playerScore').textContent = playerScore;
      document.getElementById('cpuScore').textContent = cpuScore;
    }

    function resetGame() {
      playerScore = 0;
      cpuScore = 0;
      document.getElementById('choices').textContent = 'あなた：？　｜　コンピューター：？';
      document.getElementById('message').textContent = '勝負しましょう！';
      document.getElementById('playerScore').textContent = '0';
      document.getElementById('cpuScore').textContent = '0';
    }
  </script>
</body>
</html>
